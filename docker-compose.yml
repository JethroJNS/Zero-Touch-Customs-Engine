services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocr_engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Kurangi thread untuk semua library ML
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTORCH_NUM_THREADS: "1"
      PADDLE_CPU_THREADS: "1"
      PADDLE_REC_BATCH_NUM: "4"
      PADDLE_DET_LIMIT: "640"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./ml:/app/ml
      - ./training:/app/training
      - ./training_dataset:/app/training_dataset
      - ./ml/models:/app/ml/models
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  postgres_data:
